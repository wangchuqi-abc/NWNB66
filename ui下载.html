<!DOCTYPE html>

<meta charset="UTF-8">

<title>文件下载</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    color: #1a1a1a;
  }

  .container { width: 100%; max-width: 420px; }

  .header { text-align: center; margin-bottom: 32px; }
  .header h1 { font-size: 20px; font-weight: 600; letter-spacing: .5px; }
  .header p  { margin-top: 8px; font-size: 13px; color: #9aa0a6; }

  .list { display: flex; flex-direction: column; gap: 12px; }

  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
    border: 1px solid #e8eaed;
    border-radius: 12px;
    padding: 16px 18px;
    text-decoration: none;
    color: inherit;
    transition: box-shadow .2s, transform .2s, border-color .2s;
  }
  .btn:hover {
    box-shadow: 0 6px 20px rgba(0,0,0,.07);
    transform: translateY(-2px);
    border-color: #d8dbe0;
  }
  .btn:active { transform: translateY(0); }

  .icon {
    flex: none;
    width: 40px; height: 40px;
    border-radius: 10px;
    background: #f1f3f5;
    display: flex; align-items: center; justify-content: center;
  }
  .icon svg { width: 20px; height: 20px; stroke: #5f6368; }

  .info { flex: 1; min-width: 0; }
  .name { font-size: 15px; font-weight: 500; }
  .desc { margin-top: 3px; font-size: 12px; color: #9aa0a6; }

  .arrow { flex: none; color: #c0c4c9; font-size: 18px; }
  .btn:hover .arrow { color: #5f6368; }
</style>
</head>
