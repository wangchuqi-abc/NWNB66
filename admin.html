<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 手机端适配核心代码：防止缩放，适配真实设备宽度 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BliBli_week 副站管理后台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #3498db;
            --primary-dark: #2980b9;
            --dark: #2c3e50;
            --dark-deep: #1a252f;
            --text-main: #333;
            --text-sub: #7f8c8d;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #e8e8e8, #f5f5f5, #eeeeee);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ==================== 登录界面 ==================== */
        #login-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(ellipse 55% 45% at 15% 10%, rgba(52, 152, 219, 0.12), transparent 60%),
                radial-gradient(ellipse 50% 45% at 90% 95%, rgba(44, 62, 80, 0.10), transparent 60%),
                linear-gradient(135deg, #e8e8e8, #f5f5f5, #eeeeee);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.45s ease; /* 进入后台时淡出 */
        }
        #login-overlay.hiding { opacity: 0; pointer-events: none; }
        .login-box {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 44px 32px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
            width: 90%;          /* 手机端自适应宽度 */
            max-width: 420px;    /* 电脑端最大宽度 */
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        .login-logo {
            width: 56px; height: 56px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            background: linear-gradient(135deg, var(--dark), var(--primary));
            border-radius: 14px;
            color: #fff;
            box-shadow: 0 6px 16px rgba(52, 152, 219, 0.35);
        }
        .login-box h2 { margin-bottom: 28px; color: var(--dark); font-size: 1.4rem; line-height: 1.5; }
        .login-box input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 18px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s, box-shadow 0.3s;
        }
        .login-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15); }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--dark), var(--primary));
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 4px;
            transition: transform 0.2s, box-shadow 0.3s;
        }
        .login-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(52, 152, 219, 0.35); }
        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 12px;
            display: none;
            animation: shake 0.4s ease;
        }

        /* ==================== 左侧导航栏 ==================== */
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, var(--dark) 0%, var(--dark-deep) 100%);
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease; /* 手机端滑动动画 */
            z-index: 100;
        }
        .sidebar-header {
            padding: 22px 20px;
            font-size: 1.15rem;
            font-weight: bold;
            text-align: center;
            line-height: 1.5;
            border-bottom: 1px solid #34495e;
            background-color: rgba(0, 0, 0, 0.18);
            color: #fff;
        }
        .nav-links { list-style: none; padding: 16px 0; flex: 1; }
        .nav-links li {
            padding: 15px 22px;
            margin: 4px 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            border-radius: 8px;
            color: #bdc3c7;
            border-left: 4px solid transparent;
            transition: background 0.3s, color 0.3s;
        }
        .nav-links li:hover { background-color: rgba(52, 73, 94, 0.6); color: #fff; }
        .nav-links li.active {
            background-color: #34495e;
            border-left-color: var(--primary);
            color: #fff;
        }
        .logout-btn {
            margin: 14px;
            padding: 13px 20px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            border-radius: 8px;
            background-color: #c0392b;
            color: #fff;
            transition: background 0.3s;
        }
        .logout-btn:hover { background-color: #e74c3c; }

        /* 手机端：点击菜单后收起侧边栏的遮罩 */
        #sidebar-mask {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 99;
        }

        /* ==================== 右侧主内容区 ==================== */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* 顶部栏 */
        .top-bar {
            background-color: #fff;
            padding: 14px 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .menu-toggle {
            display: none; /* 默认隐藏，手机端显示 */
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--dark);
        }
        .page-title { font-size: 1.2rem; font-weight: 600; color: var(--dark); }
        .user-info {
            font-size: 0.85rem;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-avatar {
            width: 30px; height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--dark), var(--primary));
            color: #fff;
            font-size: 0.8rem;
        }

        .content-area { flex: 1; padding: 24px; overflow-y: auto; }
        .panel { display: none; animation: fadeIn 0.3s; }
        .panel.active { display: block; }
        .placeholder-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            align-items: center;
            height: 220px;
            color: #95a5a6;
            font-size: 1.2rem;
            border: 2px dashed #bdc3c7;
            border-radius: 12px;
            background-color: #fafafa;
            max-width: 600px;
        }
        .placeholder-box small { font-size: 0.85rem; color: #b0b8bc; }

        /* 表单卡片 */
        .card {
            background: #fff;
            padding: 26px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 600px;
        }
        .card h2 {
            margin-bottom: 20px;
            color: var(--dark);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card h2::before {
            content: '';
            width: 4px; height: 18px;
            border-radius: 2px;
            background: var(--primary);
        }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #34495e; font-size: 0.9rem; }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s, box-shadow 0.3s;
        }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.12); }
        .form-group input[readonly] { background-color: #f9f9f9; color: var(--text-sub); }
        .btn {
            width: 100%;
            padding: 13px 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.3s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(52, 152, 219, 0.3); }
        .hint { margin-top: 12px; font-size: 0.8rem; color: var(--text-sub); }

        /* Toast 提示 */
        #toast {
            position: fixed;
            left: 50%;
            top: 24px;
            transform: translateX(-50%) translateY(-16px);
            padding: 12px 24px;
            border-radius: 10px;
            background: rgba(44, 62, 80, 0.92);
            color: #fff;
            font-size: 0.9rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 0.3s, transform 0.3s;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #toast.success { background: rgba(39, 174, 96, 0.92); }
        #toast.error { background: rgba(192, 57, 43, 0.92); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* ==================== 进入后台过渡动画 ==================== */
        /* 未进入前：侧边栏与主内容区隐藏 */
        .sidebar, .main-content { opacity: 0; }
        /* 进入后：侧边栏先淡入，主内容区稍后上浮淡入 */
        body.entered .sidebar {
            opacity: 1;
            transition: opacity 0.5s ease, transform 0.3s ease;
        }
        body.entered .main-content {
            animation: riseIn 0.55s ease 0.2s both;
        }
        /* 面板卡片依次上浮（配合标签切换动画） */
        body.entered .panel.active .card,
        body.entered .panel.active .placeholder-box {
            animation: fadeIn 0.5s ease both;
        }
        @keyframes riseIn {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ==================== 手机端响应式断点 ==================== */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0; left: 0;
                height: 100%;
                transform: translateX(-100%); /* 默认隐藏在屏幕外 */
            }
            .sidebar.open { transform: translateX(0); } /* 点击菜单后滑出 */
            .sidebar.open + #sidebar-mask { display: block; }
            .menu-toggle { display: block; }
            .page-title { font-size: 1rem; }
            .content-area { padding: 16px; }
            .card { padding: 20px; }
        }

        /* ==================== 视频生成面板 ==================== */
        .vg-layout {
            display: grid;
            grid-template-columns: 1fr 480px;
            gap: 24px;
            max-width: 1400px;
        }
        .vg-form-section { min-height: 0; }
        .vg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .vg-header h2 {
            color: var(--dark);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .vg-header h2::before {
            content: '';
            width: 4px; height: 22px;
            border-radius: 2px;
            background: linear-gradient(180deg, #a8e063, #56ab2f);
        }
        .btn-generate {
            padding: 12px 28px;
            background: linear-gradient(135deg, #a8e063, #56ab2f);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.3s;
            white-space: nowrap;
        }
        .btn-generate:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(86, 171, 47, 0.35); }
        .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 排名条目卡片 */
        .rank-entry {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 12px;
            overflow: hidden;
            border-left: 4px solid transparent;
            transition: border-color 0.3s;
        }
        .rank-entry.active { border-left-color: #56ab2f; }
        .rank-entry-header {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            cursor: pointer;
            user-select: none;
            background: #fafbfc;
            transition: background 0.2s;
        }
        .rank-entry-header:hover { background: #f0f4f8; }
        .rank-entry-header .arrow {
            margin-right: 12px;
            font-size: 0.8rem;
            color: var(--text-sub);
            transition: transform 0.3s;
        }
        .rank-entry.expanded .rank-entry-header .arrow { transform: rotate(90deg); }
        .rank-entry-header .rank-num {
            width: 36px; height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, #a8e063, #56ab2f);
            color: #fff;
            font-weight: bold;
            font-size: 0.95rem;
            margin-right: 14px;
        }
        .rank-entry-header .rank-title-preview {
            flex: 1;
            font-size: 0.95rem;
            color: var(--dark);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rank-entry-header .rank-status {
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 999px;
            background: #e8f5e9;
            color: #2e7d32;
            margin-left: 10px;
        }
        .rank-entry-header .rank-status.pending { background: #fff3e0; color: #e65100; }
        .rank-entry-body {
            display: none;
            padding: 18px;
            border-top: 1px solid #eee;
        }
        .rank-entry.expanded .rank-entry-body { display: block; }

        /* 表单网格 */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .form-grid .full-width { grid-column: 1 / -1; }
        .form-group-sm label { font-size: 0.8rem; margin-bottom: 5px; }
        .form-group-sm input,
        .form-group-sm select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border 0.3s;
        }
        .form-group-sm input:focus,
        .form-group-sm select:focus { border-color: #56ab2f; }
        .file-input-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .file-input-wrap input[type="file"] {
            flex: 1;
            padding: 8px;
            border: 1px dashed #ccc;
            border-radius: 6px;
            font-size: 0.85rem;
            background: #fafafa;
        }
        .file-input-wrap .file-name {
            font-size: 0.8rem;
            color: var(--text-sub);
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Canvas 预览区 */
        .vg-preview-section {
            position: sticky;
            top: 0;
            align-self: start;
        }
        .preview-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            padding: 18px;
        }
        .preview-card h3 {
            font-size: 1rem;
            color: var(--dark);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .canvas-wrap {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .canvas-wrap canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .canvas-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.9rem;
            gap: 8px;
        }
        .canvas-placeholder span { font-size: 2rem; }

        /* 进度条 */
        .progress-bar-wrap {
            margin-top: 14px;
            display: none;
        }
        .progress-bar-wrap.visible { display: block; }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }
        .progress-track {
            height: 8px;
            background: #eee;
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #a8e063, #56ab2f);
            border-radius: 999px;
            transition: width 0.3s;
            width: 0%;
        }

        /* 素材路径提示 */
        .asset-hint {
            background: #f0f7ff;
            border: 1px solid #b3d4fc;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 18px;
            font-size: 0.8rem;
            color: #1a5276;
            line-height: 1.6;
        }
        .asset-hint strong { color: #2c3e50; }

        @media (max-width: 1100px) {
            .vg-layout { grid-template-columns: 1fr; }
            .vg-preview-section { position: static; }
        }
    </style>
</head>
<body>

    <!-- 登录遮罩层 -->
    <div id="login-overlay">
        <div class="login-box">
            <div class="login-logo">📺</div>
            <h2>哔哩哔哩WEEK<br>工作人员后台</h2>
            <input type="text" id="login-user" placeholder="请输入用户名" autocomplete="username">
            <input type="password" id="login-pass" placeholder="请输入密码" autocomplete="current-password">
            <button class="login-btn" onclick="checkLogin()">进入后台</button>
            <div class="error-msg" id="error-msg">用户名或密码错误！</div>
        </div>
    </div>

    <!-- 左侧导航 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">哔哩哔哩WEEK<br>工作人员后台</div>
        <ul class="nav-links">
            <li class="active" onclick="switchTab('bv-replace', this)">🔄 周榜 BV 号替换</li>
            <li onclick="switchTab('video-gen', this)">🎬 批量视频生成</li>
            <li onclick="switchTab('single-video-gen', this)">🎯 单个视频生成</li>
        </ul>
        <div class="logout-btn" onclick="logout()">🚪 退出登录</div>
    </div>

    <!-- 手机端侧边栏遮罩 -->
    <div id="sidebar-mask" onclick="toggleMenu()"></div>

    <!-- 右侧内容 -->
    <div class="main-content">
        <div class="top-bar">
            <!-- 手机端菜单按钮 -->
            <button class="menu-toggle" onclick="toggleMenu()">☰</button>
            <div class="page-title" id="page-title">周榜BV号替换</div>
            <div class="user-info"><span class="user-avatar">站</span>站长</div>
        </div>

        <div class="content-area">
            <!-- 面板1：周榜BV号替换 -->
            <div id="bv-replace" class="panel active">
                <div class="card">
                    <h2>当前播放配置</h2>
                    <div class="form-group">
                        <label>当前视频 BV号：</label>
                        <input type="text" id="current-bv" value="BV1Z4b96sEWy" readonly>
                    </div>
                    <div class="form-group">
                        <label>更新为新 BV号：</label>
                        <input type="text" id="new-bv" placeholder="例如：BV1xx411c7mD">
                    </div>
                    <button class="btn" onclick="updateVideo()">确认替换并下载</button>
                    <p class="hint">* 点击下载后，请将生成的 index.html 上传至服务器覆盖原文件。</p>
                </div>
            </div>

            <!-- 面板 2：批量视频生成 -->
            <div id="video-gen" class="panel">
                <div class="vg-layout">
                    <!-- 左侧：数据录入表单 -->
                    <div class="vg-form-section">
                        <div class="vg-header">
                            <h2>周榜视频生成 · Top 20</h2>
                            <button class="btn-generate" id="btn-generate" onclick="startVideoGeneration()">🎬 开始生成视频</button>
                        </div>
            
                        <div id="rank-entries"></div>
                    </div>
            
                    <!-- 右侧：Canvas 预览 -->
                    <div class="vg-preview-section">
                        <div class="preview-card">
                            <h3>🖼️ 实时预览</h3>
                            <div class="canvas-wrap">
                                <canvas id="preview-canvas" width="1920" height="1080"></canvas>
                                <div class="canvas-placeholder" id="canvas-placeholder">
                                    <span></span>
                                    <div>填写数据后自动预览</div>
                                </div>
                            </div>
                            <div class="progress-bar-wrap" id="progress-wrap">
                                <div class="progress-label">
                                    <span id="progress-text">准备中...</span>
                                    <span id="progress-percent">0%</span>
                                </div>
                                <div class="progress-track">
                                    <div class="progress-fill" id="progress-fill"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 面板 3：单个视频生成 -->
            <div id="single-video-gen" class="panel">
                <div class="vg-layout">
                    <div class="vg-form-section">
                        <div class="vg-header">
                            <h2>单个排名视频生成</h2>
                            <button class="btn-generate" id="btn-single-generate" onclick="startSingleVideoGeneration()">🎯 生成选定排名</button>
                        </div>
            
                        <div class="card" style="max-width: 500px; margin-bottom: 20px;">
                            <h2>选择排名范围</h2>
                            <div class="form-group">
                                <label>起始排名：</label>

        /* ---------- Toast 提示（替代 alert） ---------- */
        let toastTimer = null;
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'show' + (type ? ' ' + type : '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.className = ''; }, 2600);

        /* ---------- 登录状态 ---------- */

            if (localStorage.getItem('isLoggedIn') === 'true') {
                enterDashboard(false);
            }
        };

        // 进入后台：登录层淡出，主界面渐入
        function enterDashboard(showWelcome) {
            const overlay = document.getElementById('login-overlay');
            overlay.classList.add('hiding');
            setTimeout(() => { overlay.style.display = 'none'; }, 450);

            document.body.classList.add('entered');
            if (showWelcome) showToast('欢迎回来，站长！', 'success');
        }

        function checkLogin() {
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            const errorMsg = document.getElementById('error-msg');

            if (user === VALID_USER && pass === VALID_PASS) {
                localStorage.setItem('isLoggedIn', 'true');
                enterDashboard(true);
            } else {
                errorMsg.style.display = 'block';
                // 重新触发动画
                errorMsg.style.animation = 'none';
                void errorMsg.offsetWidth;
                errorMsg.style.animation = '';
            }
        }

        // 输入框内按回车也可登录
        ['login-user', 'login-pass'].forEach(id => {
            document.getElementById(id).addEventListener('keydown', e => {
                if (e.key === 'Enter') checkLogin();

        });

        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('isLoggedIn');
                location.reload();
            }
        }

        /* ---------- 界面交互 ---------- */
        // 切换标签页
        function switchTab(tabId, element) {

            const titleMap = { 'bv-replace': '周榜 BV 号替换', 'video-gen': '批量视频生成', 'single-video-gen': '单个视频生成' };

                document.getElementById('sidebar').classList.remove('open');

        }

        /* ---------- 核心功能：替换BV号并下载排名页 ---------- */
        function updateVideo() {
            const newBv = document.getElementById('new-bv').value.trim();
            if (!newBv) { showToast('请输入新的 BV号！', 'error'); return; }

            // 注意：此模板与「BliBli_week副站排名.html」保持同步
            const indexHtmlTemplate = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BliBli_week副站排名</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: radial-gradient(ellipse 60% 40% at 50% -10%, rgba(251, 114, 153, 0.14), transparent 60%), radial-gradient(ellipse 50% 40% at 90% 110%, rgba(0, 174, 236, 0.10), transparent 60%), #121212; color: #fff; font-family: 'Microsoft YaHei', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; }

        .video-container { position: relative; width: 100%; max-width: 900px; aspect-ratio: 16 / 9; background: #000; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 24px rgba(0, 0, 0, 0.55), 0 0 60px rgba(251, 114, 153, 0.08); animation: fadeUp 0.6s ease both; }

    </style>
</head>
<body>
    <span class="title-badge">WEEKLY RANKING · 周榜</span>
    <h1>BliBli_week副站排名</h1>

            // 生成 index.html 并触发下载
            const blob = new Blob([indexHtmlTemplate], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');

            a.click();
            document.body.removeChild(a);

        }

        /* ==================== 视频生成功能 ==================== */
        const TOTAL_RANKS = 20;
        const CHANGE_TYPES = [
            { value: 'new', label: 'New（新上榜）' },
            { value: 'up', label: '↑ 上升' },
            { value: 'down', label: '↓ 下降' },
            { value: 'flat', label: '— 持平' },
            { value: 're', label: 'Re（重新上榜）' }
        ];

        // 排名数据
        let rankData = Array.from({ length: TOTAL_RANKS }, (_, i) => ({
            rank: i + 1,
            changeType: i === 0 ? 'new' : 'flat',
            songName: '',
            chineseName: '',
            producer: '',
            vocalist: '',
            lastWeekRank: '',
            weeksOnChart: '',
            highestRank: '',
            videoFile: null
        }));

        // 素材图片缓存
        const assets = {};
        // 素材路径映射（网站根目录）
        const ASSET_PATHS = {
            newText: './NEW.png',
            upArrow: './上升.png',
            downArrow: './下降.png',
            flatBar: './持平.png',
            reText: './RE.png',
            rankCircle: './排名底图.png',
            historyTop: './历史顶图.png',
            historyBottom: './历史底图.png'
        };
        const REQUIRED_ASSETS = Object.keys(ASSET_PATHS).length;

        // 自动加载素材
        function loadAssets() {
            let loaded = 0;
            for (const [key, path] of Object.entries(ASSET_PATHS)) {
                const img = new Image();
                img.onload = () => {
                    assets[key] = img;
                    loaded++;
                    if (loaded === REQUIRED_ASSETS) {
                        console.log(`✅ 全部 ${REQUIRED_ASSETS} 个素材已加载`);
                        // 刷新预览
                        drawPreview(currentPreviewRank);
                        drawSinglePreview(currentPreviewRank);
                    }
                };
                img.onerror = () => {
                    console.warn(`素材加载失败: ${path}`);
                };
                img.src = path;
            }
        }

        // 初始化：生成表单
        function initVideoGenerator() {
            loadAssets(); // 自动加载素材
            renderRankEntries();
            // 延迟绘制预览
            setTimeout(() => drawPreview(0), 300);
        }

        // 渲染20个排名条目
        function renderRankEntries() {
            const container = document.getElementById('rank-entries');
            container.innerHTML = rankData.map((d, i) => `
                <div class="rank-entry${i === 0 ? ' expanded active' : ''}" id="entry-${i}">
                    <div class="rank-entry-header" onclick="toggleEntry(${i})">
                        <span class="arrow">▶</span>
                        <div class="rank-num">${d.rank}</div>
                        <div class="rank-title-preview">${d.title || '未填写标题...'}</div>
                        <span class="rank-status ${d.videoFile ? '' : 'pending'}">${d.videoFile ? '✅ 已选视频' : '⏳ 待选视频'}</span>
                    </div>
                    <div class="rank-entry-body">
                        <div class="form-grid">
                            <div class="form-group-sm full-width">
                                <label> 选择高潮视频片段：</label>
                                <div class="file-input-wrap">
                                    <input type="file" accept="video/mp4,video/webm" onchange="handleVideoSelect(${i}, this)">
                                    <span class="file-name" id="fname-${i}">${d.videoFile ? d.videoFile.name : '未选择'}</span>
                                </div>
                            </div>
                            <div class="form-group-sm">
                                <label>排名变化类型：</label>
                                <select onchange="updateField(${i}, 'changeType', this.value)">
                                    ${CHANGE_TYPES.map(t => `<option value="${t.value}"${d.changeType === t.value ? ' selected' : ''}>${t.label}</option>`).join('')}
                                </select>
                            </div>
                            <div class="form-group-sm">
                                <label>歌名（日文/原名）：</label>
                                <input type="text" placeholder="如：急性恋愛中毒" value="${d.songName}" oninput="updateField(${i}, 'songName', this.value)">
                            </div>
                            <div class="form-group-sm">
                                <label>中文名：</label>
                                <input type="text" placeholder="如：急性恋爱中毒" value="${d.chineseName}" oninput="updateField(${i}, 'chineseName', this.value)">
                            </div>
                            <div class="form-group-sm">
                                <label>P主：</label>
                                <input type="text" placeholder="如：ぴーなた" value="${d.producer}" oninput="updateField(${i}, 'producer', this.value)">
                            </div>
                            <div class="form-group-sm">
                                <label>演唱歌姬：</label>
                                <input type="text" placeholder="如：重音テト" value="${d.vocalist}" oninput="updateField(${i}, 'vocalist', this.value)">
                            </div>
                            <div class="form-group-sm">
                                <label>上周排名：</label>
                                <input type="number" placeholder="如：20" value="${d.lastWeekRank}" oninput="updateField(${i}, 'lastWeekRank', this.value)">
                            </div>
                            <div class="form-group-sm">
                                <label>在榜周数：</label>
                                <input type="number" placeholder="如：1" value="${d.weeksOnChart}" oninput="updateField(${i}, 'weeksOnChart', this.value)">
                            </div>
                            <div class="form-group-sm">
                                <label>最高排名：</label>
                                <input type="number" placeholder="如：20" value="${d.highestRank}" oninput="updateField(${i}, 'highestRank', this.value)">
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 切换条目展开/收起 + 切换预览
        function toggleEntry(index) {
            const entry = document.getElementById(`entry-${index}`);
            const wasExpanded = entry.classList.contains('expanded');
            // 收起所有
            document.querySelectorAll('.rank-entry').forEach(el => el.classList.remove('expanded', 'active'));
            // 展开当前
            entry.classList.add('expanded', 'active');
            // 更新预览
            drawPreview(index);
        }

        // 当前预览的排名索引
        let currentPreviewRank = 0;

        // 更新字段
        function updateField(index, field, value) {
            rankData[index][field] = value;
            // 更新标题预览
            const preview = document.querySelector(`#entry-${index} .rank-title-preview`);
            if (field === 'songName' || field === 'chineseName') {
                const d = rankData[index];
                const name = d.chineseName || d.songName || '未填写...';
                preview.textContent = name;
            }
            // 如果正在预览此排名，刷新 Canvas
            if (index === currentPreviewRank) drawPreview(index);
        }

        // 处理视频选择
        function handleVideoSelect(index, input) {
            const file = input.files[0];
            if (!file) return;
            rankData[index].videoFile = file;
            document.getElementById(`fname-${index}`).textContent = file.name;
            // 更新状态标签
            const status = document.querySelector(`#entry-${index} .rank-status`);
            status.textContent = '✅ 已选视频';
            status.classList.remove('pending');
            showToast(`第${index + 1}名视频已选择`, 'success');
            // 更新预览
            if (index === currentPreviewRank) drawPreview(index);
        }

        // Canvas 预览绘制
        function drawPreview(rankIndex) {
            const canvas = document.getElementById('preview-canvas');
            const ctx = canvas.getContext('2d');
            const d = rankData[rankIndex];
            const W = 1920, H = 1080;
            currentPreviewRank = rankIndex;

            // 深色占位背景（预览模式不播放视频）
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, W, H);
            // 中心提示
            ctx.fillStyle = '#0f3460';
            ctx.font = 'bold 100px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText(`#${d.rank}`, W / 2, H / 2 - 30);
            ctx.font = '36px Microsoft YaHei';
            ctx.fillStyle = '#888';
            const previewName = d.chineseName || d.songName || '等待填写...';
            ctx.fillText(previewName, W / 2, H / 2 + 30);

            // 绘制 UI 叠加层（预览时完全显示）
            ctx.globalAlpha = 1;

            // 左下角：排名圆框
            if (assets.rankCircle) {
                ctx.drawImage(assets.rankCircle, 60, H - 280, 200, 200);
            }
            // 排名数字
            ctx.fillStyle = '#56ab2f';
            ctx.font = 'bold 90px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText(String(d.rank), 160, H - 155);

            // 变化标记（放在圆形右下角，合适大小）
            const changeImg = getChangeImage(d.changeType);
            if (changeImg) {
                // 圆形右下角：(60+200, H-280+200) = (260, H-80)
                // 标记中心对齐右下角，尺寸 120×120
                const size = 120;
                ctx.drawImage(changeImg, 260 - size / 2, H - 80 - size / 2, size, size);
            }

            // 标题：歌名（中文名）
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 52px Microsoft YaHei';
            ctx.textAlign = 'left';
            const displayName = d.chineseName || d.songName || '';
            ctx.fillText(displayName, 300, H - 200);
            // 副标题：P主 - 演唱歌姬
            ctx.font = '32px Microsoft YaHei';
            ctx.fillStyle = '#ccc';
            const artistLine = [d.producer, d.vocalist].filter(Boolean).join(' - ');
            ctx.fillText(artistLine || '', 300, H - 150);

            // 歌词框（不再使用）

            // 数据框背景（历史底图）
            if (assets.historyBottom) ctx.drawImage(assets.historyBottom, W - 520, H - 170, 460, 120);
            // 三个数据
            ctx.fillStyle = '#56ab2f';
            ctx.font = 'bold 56px Microsoft YaHei';
            ctx.textAlign = 'center';
            const dataX = [W - 430, W - 290, W - 150];
            const dataVals = [d.lastWeekRank || '-', d.weeksOnChart || '-', d.highestRank || '-'];
            dataVals.forEach((v, i) => ctx.fillText(v, dataX[i], H - 90));

            // 底部标签（历史顶图）
            if (assets.historyTop) ctx.drawImage(assets.historyTop, W - 520, H - 55, 460, 35);

            ctx.globalAlpha = 1;
            document.getElementById('canvas-placeholder').style.display = 'none';
        }

        // 获取变化标记图片
        function getChangeImage(type) {
            const map = {
                new: assets.newText,
                up: assets.upArrow,
                down: assets.downArrow,
                flat: assets.flatBar,
                re: assets.reText
            };
            return map[type] || null;
        }

        // 开始生成视频
        async function startVideoGeneration() {
            // 验证：检查是否所有排名都有视频
            const missing = rankData.filter(d => !d.videoFile);
            if (missing.length > 0) {
                showToast(`还有 ${missing.length} 个排名未选择视频！`, 'error');
                return;
            }

            const btn = document.getElementById('btn-generate');
            btn.disabled = true;
            btn.textContent = '⏳ 生成中...';

            const progressWrap = document.getElementById('progress-wrap');
            progressWrap.classList.add('visible');

            try {
                await generateVideo(progressWrap);
                showToast('✅ 视频生成完成！', 'success');
            } catch (err) {
                console.error(err);
                showToast('❌ 生成失败：' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '🎬 开始生成视频';
            }
        }

        // 核心：生成视频
        async function generateVideo(progressWrap) {
            const canvas = document.getElementById('preview-canvas');
            const ctx = canvas.getContext('2d');
            const W = 1920, H = 1080;
            const FADE_DURATION = 0.5; // 淡入淡出各0.5秒

            // 创建 MediaRecorder
            const stream = canvas.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9', videoBitsPerSecond: 8000000 });
            const chunks = [];
            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

            const downloadPromise = new Promise(resolve => {
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `bliBli_week_ranking_${new Date().toISOString().slice(0, 10)}.webm`;
                    a.click();
                    URL.revokeObjectURL(url);
                    resolve();
                };
            });

            recorder.start();

            // 逐个处理每个排名
            for (let i = 0; i < TOTAL_RANKS; i++) {
                const d = rankData[i];

                // 创建临时 video 元素（不静音，否则录不到声音）
                const videoUrl = URL.createObjectURL(d.videoFile);
                const video = document.createElement('video');
                video.src = videoUrl;
                video.playsInline = true;
                await new Promise(r => { video.onloadedmetadata = r; });

                // 将当前视频的音频轨道加入录制流（先移除上一条，避免混音）
                stream.getAudioTracks().forEach(t => stream.removeTrack(t));
                video.captureStream().getAudioTracks().forEach(t => stream.addTrack(t));

                const duration = video.duration;
                const totalSegmentTime = duration * 1000;

                // 淡入阶段（0 ~ FADE_DURATION）
                const fadeInStart = performance.now();
                while (performance.now() - fadeInStart < FADE_DURATION * 1000) {
                    const elapsed = (performance.now() - fadeInStart) / 1000;
                    const alpha = Math.min(elapsed / FADE_DURATION, 1);
                    drawFrame(ctx, video, d, alpha, W, H);
                    await sleepFrame();
                }

                // 播放阶段：等待视频真正开始播放
                await video.play();
                const playStart = performance.now();
                const playDuration = Math.max((duration - FADE_DURATION * 2) * 1000, 0);
                while (performance.now() - playStart < playDuration) {
                    if (!video.paused && !video.ended) {
                        drawFrame(ctx, video, d, 1, W, H);
                    }
                    // 实时更新进度
                    const elapsed = performance.now() - fadeInStart;
                    const rankProgress = Math.min(elapsed / totalSegmentTime, 1);
                    const overallProgress = ((i + rankProgress) / TOTAL_RANKS * 100).toFixed(0);
                    updateProgress(progressWrap, `正在处理第 ${i + 1}/20 名...`, overallProgress);
                    await sleepFrame();
                }
                video.pause();

                // 淡出阶段
                const fadeOutStart = performance.now();
                while (performance.now() - fadeOutStart < FADE_DURATION * 1000) {
                    const elapsed = (performance.now() - fadeOutStart) / 1000;
                    const alpha = 1 - Math.min(elapsed / FADE_DURATION, 1);
                    if (!video.paused && !video.ended) {
                        drawFrame(ctx, video, d, alpha, W, H);
                    }
                    await sleepFrame();
                }

                URL.revokeObjectURL(videoUrl);
                video.remove();
            }

            updateProgress(progressWrap, '正在导出...', '100');
            recorder.stop();
            await downloadPromise;
        }

        // 绘制单帧
        function drawFrame(ctx, video, d, uiAlpha, W, H) {
            // 绘制视频背景
            ctx.globalAlpha = 1;
            ctx.drawImage(video, 0, 0, W, H);

            // 绘制 UI 叠加层（带透明度）
            ctx.globalAlpha = uiAlpha;

            // 左下角：排名圆框
            if (assets.rankCircle) ctx.drawImage(assets.rankCircle, 60, H - 280, 200, 200);
            ctx.fillStyle = '#56ab2f';
            ctx.font = 'bold 90px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText(String(d.rank), 160, H - 155);

            // 变化标记（圆形右下角，合适大小）
            const changeImg = getChangeImage(d.changeType);
            if (changeImg) {
                const size = 120;
                ctx.drawImage(changeImg, 260 - size / 2, H - 80 - size / 2, size, size);
            }

            // 标题：歌名（中文名）
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 52px Microsoft YaHei';
            ctx.textAlign = 'left';
            const displayName = d.chineseName || d.songName || '';
            ctx.fillText(displayName, 300, H - 200);
            // 副标题：P主 - 演唱歌姬
            ctx.font = '32px Microsoft YaHei';
            ctx.fillStyle = '#ccc';
            const artistLine = [d.producer, d.vocalist].filter(Boolean).join(' - ');
            ctx.fillText(artistLine || '', 300, H - 150);

            // 歌词框（不再使用）

            // 数据框（历史底图）
            if (assets.historyBottom) ctx.drawImage(assets.historyBottom, W - 520, H - 170, 460, 120);
            ctx.fillStyle = '#56ab2f';
            ctx.font = 'bold 56px Microsoft YaHei';
            ctx.textAlign = 'center';
            [d.lastWeekRank || '-', d.weeksOnChart || '-', d.highestRank || '-'].forEach((v, i) => {
                ctx.fillText(v, W - 430 + i * 140, H - 90);
            });

            // 底部标签（历史顶图）
            if (assets.historyTop) ctx.drawImage(assets.historyTop, W - 520, H - 55, 460, 35);

            ctx.globalAlpha = 1;
        }

        function updateProgress(wrap, text, percent) {
            document.getElementById('progress-text').textContent = text;
            document.getElementById('progress-percent').textContent = percent + '%';
            document.getElementById('progress-fill').style.width = percent + '%';
        }

        function sleepFrame() {
            return new Promise(r => requestAnimationFrame(r));
        }

        // 页面加载完成后初始化视频生成器
        window.addEventListener('DOMContentLoaded', () => {
            if (document.getElementById('video-gen').classList.contains('active')) {
                initVideoGenerator();
            }
        });

        // 切换到视频生成面板时初始化
        const _origSwitchTab = window.switchTab;
        window.switchTab = function(tabId, element) {
            _origSwitchTab(tabId, element);
            if (tabId === 'video-gen' && !window._vgInitialized) {
                initVideoGenerator();
                window._vgInitialized = true;
            }
            if (tabId === 'single-video-gen') {
                updateSingleRankPreview();
            }
        };

        /* ==================== 单个视频生成功能 ==================== */
        // 更新单个生成的排名预览
        function updateSingleRankPreview() {
            const startRank = parseInt(document.getElementById('single-start-rank').value) || 1;
            const endRank = parseInt(document.getElementById('single-end-rank').value) || 5;
            
            // 验证范围
            const validStart = Math.max(1, Math.min(20, startRank));
            const validEnd = Math.max(1, Math.min(20, endRank));
            
            if (validStart > validEnd) {
                document.getElementById('single-rank-count').value = '范围无效';
                return;
            }
            
            const count = validEnd - validStart + 1;
            document.getElementById('single-rank-count').value = `${count} 个排名`;
            
            // 更新预览列表
            const previewContainer = document.getElementById('single-rank-preview');
            const ranks = rankData.slice(validStart - 1, validEnd);
            
            previewContainer.innerHTML = ranks.map((d, i) => {
                const actualRank = validStart + i;
                const hasVideo = d.videoFile ? '✅' : '⏳';
                const name = d.chineseName || d.songName || '未填写';
                return `
                    <div style="display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; cursor: pointer;" onclick="drawSinglePreview(${actualRank - 1})">
                        <div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #a8e063, #56ab2f); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px;">
                            ${actualRank}
                        </div>
                        <div style="flex: 1;">
                            <div style="font-size: 0.9rem; color: var(--dark);">${name}</div>
                            <div style="font-size: 0.75rem; color: var(--text-sub);">${d.producer || ''} ${d.vocalist ? '- ' + d.vocalist : ''}</div>
                        </div>
                        <div style="font-size: 0.8rem; color: ${d.videoFile ? '#27ae60' : '#e67e22'};">
                            ${hasVideo} ${d.videoFile ? '已选视频' : '待选视频'}
                        </div>
                    </div>
                `;
            }).join('');
            
            // 默认预览第一个
            if (ranks.length > 0) {
                drawSinglePreview(validStart - 1);
            }
            
            // 生成填写表单
            renderSingleRankForms(validStart, validEnd);
        }
        
        // 渲染单个排名的填写表单
        function renderSingleRankForms(startRank, endRank) {
            const container = document.getElementById('single-rank-forms');
            const ranks = rankData.slice(startRank - 1, endRank);
            
            container.innerHTML = ranks.map((d, i) => {
                const actualRank = startRank + i;
                return `
                    <div class="rank-entry expanded" id="single-entry-${actualRank - 1}" style="margin-top: 20px;">
                        <div class="rank-entry-header" onclick="toggleSingleEntry(${actualRank - 1})">
                            <span class="arrow">▶</span>
                            <div class="rank-num">${actualRank}</div>
                            <div class="rank-title-preview">${d.chineseName || d.songName || '未填写标题...'}</div>
                            <span class="rank-status ${d.videoFile ? '' : 'pending'}">${d.videoFile ? '✅ 已选视频' : '⏳ 待选视频'}</span>
                        </div>
                        <div class="rank-entry-body">
                            <div class="form-grid">
                                <div class="form-group-sm full-width">
                                    <label>🎬 选择高潮视频片段：</label>
                                    <div class="file-input-wrap">
                                        <input type="file" accept="video/mp4,video/webm" onchange="handleSingleVideoSelect(${actualRank - 1}, this)">
                                        <span class="file-name" id="single-fname-${actualRank - 1}">${d.videoFile ? d.videoFile.name : '未选择'}</span>
                                    </div>
                                </div>
                                <div class="form-group-sm">
                                    <label>排名变化类型：</label>
                                    <select onchange="updateSingleField(${actualRank - 1}, 'changeType', this.value)">
                                        ${CHANGE_TYPES.map(t => `<option value="${t.value}"${d.changeType === t.value ? ' selected' : ''}>${t.label}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="form-group-sm">
                                    <label>歌名（日文/原名）：</label>
                                    <input type="text" placeholder="如：急性恋愛中毒" value="${d.songName}" oninput="updateSingleField(${actualRank - 1}, 'songName', this.value)">
                                </div>
                                <div class="form-group-sm">
                                    <label>中文名：</label>
                                    <input type="text" placeholder="如：急性恋爱中毒" value="${d.chineseName}" oninput="updateSingleField(${actualRank - 1}, 'chineseName', this.value)">
                                </div>
                                <div class="form-group-sm">
                                    <label>P 主：</label>
                                    <input type="text" placeholder="如：ぴーなた" value="${d.producer}" oninput="updateSingleField(${actualRank - 1}, 'producer', this.value)">
                                </div>
                                <div class="form-group-sm">
                                    <label>演唱歌姬：</label>
                                    <input type="text" placeholder="如：重音テト" value="${d.vocalist}" oninput="updateSingleField(${actualRank - 1}, 'vocalist', this.value)">
                                </div>
                                <div class="form-group-sm">
                                    <label>上周排名：</label>
                                    <input type="number" placeholder="如：20" value="${d.lastWeekRank}" oninput="updateSingleField(${actualRank - 1}, 'lastWeekRank', this.value)">
                                </div>
                                <div class="form-group-sm">
                                    <label>在榜周数：</label>
                                    <input type="number" placeholder="如：1" value="${d.weeksOnChart}" oninput="updateSingleField(${actualRank - 1}, 'weeksOnChart', this.value)">
                                </div>
                                <div class="form-group-sm">
                                    <label>最高排名：</label>
                                    <input type="number" placeholder="如：20" value="${d.highestRank}" oninput="updateSingleField(${actualRank - 1}, 'highestRank', this.value)">
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // 切换单个条目展开/收起
        function toggleSingleEntry(index) {
            const entry = document.getElementById(`single-entry-${index}`);
            entry.classList.toggle('expanded');
        }
        
        // 更新单个排名字段
        function updateSingleField(index, field, value) {
            rankData[index][field] = value;
            // 更新标题预览
            const preview = document.querySelector(`#single-entry-${index} .rank-title-preview`);
            if (field === 'songName' || field === 'chineseName') {
                const d = rankData[index];
                const name = d.chineseName || d.songName || '未填写...';
                preview.textContent = name;
            }
            // 刷新预览
            drawSinglePreview(index);
        }
        
        // 处理单个视频选择
        function handleSingleVideoSelect(index, input) {
            const file = input.files[0];
            if (!file) return;
            rankData[index].videoFile = file;
            document.getElementById(`single-fname-${index}`).textContent = file.name;
            // 更新状态标签
            const status = document.querySelector(`#single-entry-${index} .rank-status`);
            status.textContent = '✅ 已选视频';
            status.classList.remove('pending');
            showToast(`第${index + 1}名视频已选择`, 'success');
            // 更新预览
            drawSinglePreview(index);
        }
        
        // 绘制单个排名的预览
        function drawSinglePreview(rankIndex) {
            const canvas = document.getElementById('single-preview-canvas');
            const ctx = canvas.getContext('2d');
            const d = rankData[rankIndex];
            const W = 1920, H = 1080;
            
            // 深色占位背景
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, W, H);
            
            // 中心提示
            ctx.fillStyle = '#0f3460';
            ctx.font = 'bold 100px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText(`#${d.rank}`, W / 2, H / 2 - 30);
            ctx.font = '36px Microsoft YaHei';
            ctx.fillStyle = '#888';
            const previewName = d.chineseName || d.songName || '等待填写...';
            ctx.fillText(previewName, W / 2, H / 2 + 30);
            
            // 绘制 UI 叠加层
            ctx.globalAlpha = 1;
            
            // 左下角：排名圆框
            if (assets.rankCircle) ctx.drawImage(assets.rankCircle, 60, H - 280, 200, 200);
            ctx.fillStyle = '#56ab2f';
            ctx.font = 'bold 90px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText(String(d.rank), 160, H - 155);
            
            // 变化标记（圆形右下角，合适大小）
            const changeImg = getChangeImage(d.changeType);
            if (changeImg) {
                const size = 120;
                ctx.drawImage(changeImg, 260 - size / 2, H - 80 - size / 2, size, size);
            }
            
            // 标题：歌名（中文名）
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 52px Microsoft YaHei';
            ctx.textAlign = 'left';
            const displayName = d.chineseName || d.songName || '';
            ctx.fillText(displayName, 300, H - 200);
            // 副标题：P 主 - 演唱歌姬
            ctx.font = '32px Microsoft YaHei';
            ctx.fillStyle = '#ccc';
            const artistLine = [d.producer, d.vocalist].filter(Boolean).join(' - ');
            ctx.fillText(artistLine || '', 300, H - 150);
            
            // 数据框（历史底图）
            if (assets.historyBottom) ctx.drawImage(assets.historyBottom, W - 520, H - 170, 460, 120);
            ctx.fillStyle = '#56ab2f';
            ctx.font = 'bold 56px Microsoft YaHei';
            ctx.textAlign = 'center';
            [d.lastWeekRank || '-', d.weeksOnChart || '-', d.highestRank || '-'].forEach((v, i) => {
                ctx.fillText(v, W - 430 + i * 140, H - 90);
            });
            
            // 底部标签（历史顶图）
            if (assets.historyTop) ctx.drawImage(assets.historyTop, W - 520, H - 55, 460, 35);
            
            ctx.globalAlpha = 1;
            document.getElementById('single-canvas-placeholder').style.display = 'none';
        }
        
        // 开始单个视频生成
        async function startSingleVideoGeneration() {
            const startRank = parseInt(document.getElementById('single-start-rank').value) || 1;
            const endRank = parseInt(document.getElementById('single-end-rank').value) || 5;
            
            const validStart = Math.max(1, Math.min(20, startRank));
            const validEnd = Math.max(1, Math.min(20, endRank));
            
            if (validStart > validEnd) {
                showToast('排名范围无效！', 'error');
                return;
            }
            
            // 检查选定范围内是否有未选视频的排名
            const selectedRanks = rankData.slice(validStart - 1, validEnd);
            const missing = selectedRanks.filter(d => !d.videoFile);
            if (missing.length > 0) {
                showToast(`还有 ${missing.length} 个排名未选择视频！`, 'error');
                return;
            }
            
            const btn = document.getElementById('btn-single-generate');
            btn.disabled = true;
            btn.textContent = '⏳ 生成中...';
            
            const progressWrap = document.getElementById('single-progress-wrap');
            progressWrap.classList.add('visible');
            
            try {
                await generateSingleVideo(validStart, validEnd, progressWrap);
                showToast(`✅ 第${validStart}-${validEnd}名视频生成完成！`, 'success');
            } catch (err) {
                console.error(err);
                showToast(' 生成失败：' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '🎯 生成选定排名';
            }
        }
        
        // 核心：生成单个范围的视频
        async function generateSingleVideo(startRank, endRank, progressWrap) {
            const canvas = document.getElementById('single-preview-canvas');
            const ctx = canvas.getContext('2d');
            const W = 1920, H = 1080;
            const FADE_DURATION = 0.5;
            
            const stream = canvas.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9', videoBitsPerSecond: 8000000 });
            const chunks = [];
            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            
            const downloadPromise = new Promise(resolve => {
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `bliBli_week_rank_${startRank}-${endRank}_${new Date().toISOString().slice(0, 10)}.webm`;
                    a.click();
                    URL.revokeObjectURL(url);
                    resolve();
                };
            });
            
            recorder.start();
            
            const totalRanks = endRank - startRank + 1;
            
            for (let i = 0; i < totalRanks; i++) {
                const rankIndex = startRank - 1 + i;
                const d = rankData[rankIndex];
                
                const videoUrl = URL.createObjectURL(d.videoFile);
                const video = document.createElement('video');
                video.src = videoUrl;
                video.playsInline = true;
                await new Promise(r => { video.onloadedmetadata = r; });
                
                // 将当前视频的音频轨道加入录制流（先移除上一条，避免混音）
                stream.getAudioTracks().forEach(t => stream.removeTrack(t));
                video.captureStream().getAudioTracks().forEach(t => stream.addTrack(t));
                
                const duration = video.duration;
                const totalSegmentTime = duration * 1000; // 整个片段总时长（毫秒）
                
                // 淡入阶段（0 ~ FADE_DURATION 秒）
                const fadeInStart = performance.now();
                while (performance.now() - fadeInStart < FADE_DURATION * 1000) {
                    const elapsed = (performance.now() - fadeInStart) / 1000;
                    const alpha = Math.min(elapsed / FADE_DURATION, 1);
                    drawFrame(ctx, video, d, alpha, W, H);
                    await sleepFrame();
                }
                
                // 播放阶段：等待视频真正开始播放
                await video.play();
                const playStart = performance.now();
                const playDuration = Math.max((duration - FADE_DURATION * 2) * 1000, 0);
                while (performance.now() - playStart < playDuration) {
                    // 同步视频当前帧到 canvas
                    if (!video.paused && !video.ended) {
                        drawFrame(ctx, video, d, 1, W, H);
                    }
                    // 实时更新进度（基于已用时间）
                    const elapsed = performance.now() - fadeInStart;
                    const rankProgress = Math.min(elapsed / totalSegmentTime, 1);
                    const overallProgress = ((i + rankProgress) / totalRanks * 100).toFixed(0);
                    updateSingleProgress(progressWrap, `正在处理第 ${d.rank} 名...`, overallProgress);
                    await sleepFrame();
                }
                video.pause();
                
                // 淡出阶段
                const fadeOutStart = performance.now();
                while (performance.now() - fadeOutStart < FADE_DURATION * 1000) {
                    const elapsed = (performance.now() - fadeOutStart) / 1000;
                    const alpha = 1 - Math.min(elapsed / FADE_DURATION, 1);
                    if (!video.paused && !video.ended) {
                        drawFrame(ctx, video, d, alpha, W, H);
                    }
                    await sleepFrame();
                }
                
                URL.revokeObjectURL(videoUrl);
                video.remove();
            }
            
            updateSingleProgress(progressWrap, '正在导出...', '100');
            recorder.stop();
            await downloadPromise;
        }
        
        function updateSingleProgress(wrap, text, percent) {
            document.getElementById('single-progress-text').textContent = text;
            document.getElementById('single-progress-percent').textContent = percent + '%';
            document.getElementById('single-progress-fill').style.width = percent + '%';
        }
    </script>
</body>
</html>
