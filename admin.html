<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 手机端适配核心代码：防止缩放，适配真实设备宽度 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BliBli_week 副站管理后台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #3498db;
            --primary-dark: #2980b9;
            --dark: #2c3e50;
            --dark-deep: #1a252f;
            --text-main: #333;
            --text-sub: #7f8c8d;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #e8e8e8, #f5f5f5, #eeeeee);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ==================== 登录界面 ==================== */
        #login-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(ellipse 55% 45% at 15% 10%, rgba(52, 152, 219, 0.12), transparent 60%),
                radial-gradient(ellipse 50% 45% at 90% 95%, rgba(44, 62, 80, 0.10), transparent 60%),
                linear-gradient(135deg, #e8e8e8, #f5f5f5, #eeeeee);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.45s ease; /* 进入后台时淡出 */
        }
        #login-overlay.hiding { opacity: 0; pointer-events: none; }
        .login-box {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 44px 32px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
            width: 90%;          /* 手机端自适应宽度 */
            max-width: 420px;    /* 电脑端最大宽度 */
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        .login-logo {
            width: 56px; height: 56px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            background: linear-gradient(135deg, var(--dark), var(--primary));
            border-radius: 14px;
            color: #fff;
            box-shadow: 0 6px 16px rgba(52, 152, 219, 0.35);
        }
        .login-box h2 { margin-bottom: 28px; color: var(--dark); font-size: 1.4rem; line-height: 1.5; }
        .login-box input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 18px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s, box-shadow 0.3s;
        }
        .login-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15); }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--dark), var(--primary));
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 4px;
            transition: transform 0.2s, box-shadow 0.3s;
        }
        .login-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(52, 152, 219, 0.35); }
        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 12px;
            display: none;
            animation: shake 0.4s ease;
        }

        /* ==================== 左侧导航栏 ==================== */
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, var(--dark) 0%, var(--dark-deep) 100%);
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease; /* 手机端滑动动画 */
            z-index: 100;
        }
        .sidebar-header {
            padding: 22px 20px;
            font-size: 1.15rem;
            font-weight: bold;
            text-align: center;
            line-height: 1.5;
            border-bottom: 1px solid #34495e;
            background-color: rgba(0, 0, 0, 0.18);
            color: #fff;
        }
        .nav-links { list-style: none; padding: 16px 0; flex: 1; }
        .nav-links li {
            padding: 15px 22px;
            margin: 4px 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            border-radius: 8px;
            color: #bdc3c7;
            border-left: 4px solid transparent;
            transition: background 0.3s, color 0.3s;
        }
        .nav-links li:hover { background-color: rgba(52, 73, 94, 0.6); color: #fff; }
        .nav-links li.active {
            background-color: #34495e;
            border-left-color: var(--primary);
            color: #fff;
        }
        .logout-btn {
            margin: 14px;
            padding: 13px 20px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            border-radius: 8px;
            background-color: #c0392b;
            color: #fff;
            transition: background 0.3s;
        }
        .logout-btn:hover { background-color: #e74c3c; }

        /* 手机端：点击菜单后收起侧边栏的遮罩 */
        #sidebar-mask {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 99;
        }

        /* ==================== 右侧主内容区 ==================== */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* 顶部栏 */
        .top-bar {
            background-color: #fff;
            padding: 14px 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .menu-toggle {
            display: none; /* 默认隐藏，手机端显示 */
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--dark);
        }
        .page-title { font-size: 1.2rem; font-weight: 600; color: var(--dark); }
        .user-info {
            font-size: 0.85rem;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-avatar {
            width: 30px; height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--dark), var(--primary));
            color: #fff;
            font-size: 0.8rem;
        }

        .content-area { flex: 1; padding: 24px; overflow-y: auto; }
        .panel { display: none; animation: fadeIn 0.3s; }
        .panel.active { display: block; }
        .placeholder-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            align-items: center;
            height: 220px;
            color: #95a5a6;
            font-size: 1.2rem;
            border: 2px dashed #bdc3c7;
            border-radius: 12px;
            background-color: #fafafa;
            max-width: 600px;
        }
        .placeholder-box small { font-size: 0.85rem; color: #b0b8bc; }

        /* 表单卡片 */
        .card {
            background: #fff;
            padding: 26px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 600px;
        }
        .card h2 {
            margin-bottom: 20px;
            color: var(--dark);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card h2::before {
            content: '';
            width: 4px; height: 18px;
            border-radius: 2px;
            background: var(--primary);
        }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #34495e; font-size: 0.9rem; }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s, box-shadow 0.3s;
        }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.12); }
        .form-group input[readonly] { background-color: #f9f9f9; color: var(--text-sub); }
        .btn {
            width: 100%;
            padding: 13px 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.3s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(52, 152, 219, 0.3); }
        .hint { margin-top: 12px; font-size: 0.8rem; color: var(--text-sub); }

        /* Toast 提示 */
        #toast {
            position: fixed;
            left: 50%;
            top: 24px;
            transform: translateX(-50%) translateY(-16px);
            padding: 12px 24px;
            border-radius: 10px;
            background: rgba(44, 62, 80, 0.92);
            color: #fff;
            font-size: 0.9rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 0.3s, transform 0.3s;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #toast.success { background: rgba(39, 174, 96, 0.92); }
        #toast.error { background: rgba(192, 57, 43, 0.92); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* ==================== 进入后台过渡动画 ==================== */
        /* 未进入前：侧边栏与主内容区隐藏 */
        .sidebar, .main-content { opacity: 0; }
        /* 进入后：侧边栏先淡入，主内容区稍后上浮淡入 */
        body.entered .sidebar {
            opacity: 1;
            transition: opacity 0.5s ease, transform 0.3s ease;
        }
        body.entered .main-content {
            animation: riseIn 0.55s ease 0.2s both;
        }
        /* 面板卡片依次上浮（配合标签切换动画） */
        body.entered .panel.active .card,
        body.entered .panel.active .placeholder-box {
            animation: fadeIn 0.5s ease both;
        }
        @keyframes riseIn {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ==================== 手机端响应式断点 ==================== */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0; left: 0;
                height: 100%;
                transform: translateX(-100%); /* 默认隐藏在屏幕外 */
            }
            .sidebar.open { transform: translateX(0); } /* 点击菜单后滑出 */
            .sidebar.open + #sidebar-mask { display: block; }
            .menu-toggle { display: block; }
            .page-title { font-size: 1rem; }
            .content-area { padding: 16px; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- 登录遮罩层 -->
    <div id="login-overlay">
        <div class="login-box">
            <div class="login-logo">📺</div>
            <h2>哔哩哔哩WEEK<br>工作人员后台</h2>
            <input type="text" id="login-user" placeholder="请输入用户名" autocomplete="username">
            <input type="password" id="login-pass" placeholder="请输入密码" autocomplete="current-password">
            <button class="login-btn" onclick="checkLogin()">进入后台</button>
            <div class="error-msg" id="error-msg">用户名或密码错误！</div>
        </div>
    </div>

    <!-- 左侧导航 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">哔哩哔哩WEEK<br>工作人员后台</div>
        <ul class="nav-links">
            <li class="active" onclick="switchTab('bv-replace', this)">🔄 周榜BV号替换</li>
            <li onclick="switchTab('video-gen', this)">🎬 视频生成</li>
        </ul>
        <div class="logout-btn" onclick="logout()">🚪 退出登录</div>
    </div>

    <!-- 手机端侧边栏遮罩 -->
    <div id="sidebar-mask" onclick="toggleMenu()"></div>

    <!-- 右侧内容 -->
    <div class="main-content">
        <div class="top-bar">
            <!-- 手机端菜单按钮 -->
            <button class="menu-toggle" onclick="toggleMenu()">☰</button>
            <div class="page-title" id="page-title">周榜BV号替换</div>
            <div class="user-info"><span class="user-avatar">站</span>站长</div>
        </div>

        <div class="content-area">
            <!-- 面板1：周榜BV号替换 -->
            <div id="bv-replace" class="panel active">
                <div class="card">
                    <h2>当前播放配置</h2>
                    <div class="form-group">
                        <label>当前视频 BV号：</label>
                        <input type="text" id="current-bv" value="BV1Z4b96sEWy" readonly>
                    </div>
                    <div class="form-group">
                        <label>更新为新 BV号：</label>
                        <input type="text" id="new-bv" placeholder="例如：BV1xx411c7mD">
                    </div>
                    <button class="btn" onclick="updateVideo()">确认替换并下载</button>
                    <p class="hint">* 点击下载后，请将生成的 index.html 上传至服务器覆盖原文件。</p>
                </div>
            </div>

            <!-- 面板2：视频生成 -->
            <div id="video-gen" class="panel">
                <div class="placeholder-box">
                    <div>⚠️ 暂未开放 ⚠️</div>
                    <small>该功能正在建设中，敬请期待</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 提示容器 -->
    <div id="toast"></div>

    <script>
        /* ---------- 账号配置 ---------- */
        const VALID_USER = 'admin';
        const VALID_PASS = '123456789@';

        /* ---------- Toast 提示（替代 alert） ---------- */
        let toastTimer = null;
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'show' + (type ? ' ' + type : '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.className = ''; }, 2600);
        }

        /* ---------- 登录状态 ---------- */
        window.onload = function () {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                enterDashboard(false);
            }
        };

        // 进入后台：登录层淡出，主界面渐入
        function enterDashboard(showWelcome) {
            const overlay = document.getElementById('login-overlay');
            overlay.classList.add('hiding');
            setTimeout(() => { overlay.style.display = 'none'; }, 450);

            document.body.classList.add('entered');
            if (showWelcome) showToast('欢迎回来，站长！', 'success');
        }

        function checkLogin() {
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            const errorMsg = document.getElementById('error-msg');

            if (user === VALID_USER && pass === VALID_PASS) {
                localStorage.setItem('isLoggedIn', 'true');
                enterDashboard(true);
            } else {
                errorMsg.style.display = 'block';
                // 重新触发动画
                errorMsg.style.animation = 'none';
                void errorMsg.offsetWidth;
                errorMsg.style.animation = '';
            }
        }

        // 输入框内按回车也可登录
        ['login-user', 'login-pass'].forEach(id => {
            document.getElementById(id).addEventListener('keydown', e => {
                if (e.key === 'Enter') checkLogin();
            });
        });

        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('isLoggedIn');
                location.reload();
            }
        }

        /* ---------- 界面交互 ---------- */
        // 切换标签页
        function switchTab(tabId, element) {
            document.querySelectorAll('.panel').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-links li').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');

            const titleMap = { 'bv-replace': '周榜BV号替换', 'video-gen': '视频生成' };
            document.getElementById('page-title').innerText = titleMap[tabId];

            // 手机端：点击菜单后自动收起侧边栏
            closeSidebarOnMobile();
        }

        // 手机端菜单开关
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function closeSidebarOnMobile() {
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        /* ---------- 核心功能：替换BV号并下载排名页 ---------- */
        function updateVideo() {
            const newBv = document.getElementById('new-bv').value.trim();
            if (!newBv) { showToast('请输入新的 BV号！', 'error'); return; }

            // 注意：此模板与「BliBli_week副站排名.html」保持同步
            const indexHtmlTemplate = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BliBli_week副站排名</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: radial-gradient(ellipse 60% 40% at 50% -10%, rgba(251, 114, 153, 0.14), transparent 60%), radial-gradient(ellipse 50% 40% at 90% 110%, rgba(0, 174, 236, 0.10), transparent 60%), #121212; color: #fff; font-family: 'Microsoft YaHei', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; }
        .title-badge { display: inline-block; margin-bottom: 14px; padding: 5px 16px; font-size: 0.8rem; letter-spacing: 2px; color: #fb7299; border: 1px solid rgba(251, 114, 153, 0.45); border-radius: 999px; background: rgba(251, 114, 153, 0.08); }
        h1 { font-size: 2.5rem; margin-bottom: 32px; text-align: center; background: linear-gradient(90deg, #fb7299, #ffffff 55%, #00aeec); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 24px rgba(251, 114, 153, 0.25); }
        .video-container { position: relative; width: 100%; max-width: 900px; aspect-ratio: 16 / 9; background: #000; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 24px rgba(0, 0, 0, 0.55), 0 0 60px rgba(251, 114, 153, 0.08); animation: fadeUp 0.6s ease both; }
        .video-container iframe { width: 100%; height: 100%; border: none; }
        .admin-link { margin-top: 24px; padding: 8px 22px; color: #9aa0a6; text-decoration: none; font-size: 0.9rem; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 999px; transition: color 0.3s, border-color 0.3s, background 0.3s; }
        .admin-link:hover { color: #fff; border-color: #fb7299; background: rgba(251, 114, 153, 0.12); }
        .footer-credits { margin-top: 44px; text-align: center; font-size: 0.9rem; color: #888; line-height: 1.8; }
        .footer-credits a { color: #00aeec; text-decoration: none; transition: color 0.3s; }
        .footer-credits a:hover { color: #fff; text-decoration: underline; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { body { padding: 24px 16px; } h1 { font-size: 1.8rem; margin-bottom: 24px; } .footer-credits { margin-top: 32px; font-size: 0.8rem; } }
    </style>
</head>
<body>
    <span class="title-badge">WEEKLY RANKING · 周榜</span>
    <h1>BliBli_week副站排名</h1>
    <div class="video-container">
        <iframe src="//player.bilibili.com/player.html?bvid=${newBv}&page=1&high_quality=1&danmaku=0" allowfullscreen="allowfullscreen"></iframe>
    </div>
    <a href="admin.html" class="admin-link">管理员界面</a>
    <div class="footer-credits">
        <p>视频数据来源：<a href="https://vocabili.top/" target="_blank">https://vocabili.top/</a></p>
        <p>感谢 biliboard 工作室所有人员对此网站的支持</p>
    </div>
</body>
</html>`;

            // 生成 index.html 并触发下载
            const blob = new Blob([indexHtmlTemplate], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            document.getElementById('current-bv').value = newBv;
            document.getElementById('new-bv').value = '';
            showToast('✅ 文件已生成！请将下载的 index.html 上传到服务器覆盖原文件。', 'success');
        }
    </script>
</body>
</html>
