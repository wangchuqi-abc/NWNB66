<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - BliBli_week 后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: radial-gradient(ellipse 60% 40% at 50% -10%, rgba(251, 114, 153, 0.14), transparent 60%),
                        radial-gradient(ellipse 50% 40% at 90% 110%, rgba(0, 174, 236, 0.10), transparent 60%),
                        #121212;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(8px);
            padding: 50px 40px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        .login-box .logo {
            font-size: 3rem;
            margin-bottom: 6px;
        }
        .login-box h1 {
            font-size: 1.4rem;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        .login-box .subtitle {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 28px;
        }
        .login-box input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s, box-shadow 0.3s;
        }
        .login-box input:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.12);
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
        }
        .login-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.4);
        }
        .login-box button:active {
            transform: translateY(0);
        }
        .login-box .error {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 12px;
            display: none;
        }
        .login-box .hint {
            margin-top: 18px;
            font-size: 0.78rem;
            color: #aaa;
            border-top: 1px solid #eee;
            padding-top: 16px;
        }
        .login-box .hint span {
            color: #3498db;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake {
            animation: shake 0.4s ease;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">📺</div>
        <h1>哔哩哔哩WEEK</h1>
        <p class="subtitle">工作人员后台登录</p>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
        <button onclick="handleLogin()">登 录</button>
        <div class="error" id="errorMsg">❌ 用户名或密码错误！</div>
        <div class="hint">默认账号: <span>admin</span> / 密码: <span>123456789@</span></div>
    </div>

    <script>
        const VALID_USER = 'admin';
        const VALID_PASS = '123456789@';

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (user === VALID_USER && pass === VALID_PASS) {
                localStorage.setItem('bili_admin_logged_in', 'true');
                localStorage.setItem('bili_admin_user', user);
                localStorage.setItem('bili_admin_login_time', new Date().toISOString());
                window.location.href = 'admin.html';
            } else {
                errorMsg.style.display = 'block';
                errorMsg.classList.remove('shake');
                void errorMsg.offsetWidth;
                errorMsg.classList.add('shake');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }

        if (localStorage.getItem('bili_admin_logged_in') === 'true') {
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
