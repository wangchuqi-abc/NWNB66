<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频链接抓取测试</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Microsoft YaHei', sans-serif;
        background: #1a1a2e;
        color: #eee;
        min-height: 100vh;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .wrap { width: 100%; max-width: 720px; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    .sub { color: #888; font-size: .85rem; margin-bottom: 24px; }
    .row { display: flex; gap: 10px; margin-bottom: 16px; }
    input[type=text] {
        flex: 1;
        padding: 12px 14px;
        border: 1px solid #444;
        border-radius: 8px;
        background: #12121f;
        color: #eee;
        font-size: .9rem;
        outline: none;
        transition: border-color .2s;
    }
    input[type=text]:focus { border-color: #3498db; }
    button {
        padding: 12px 22px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #3498db, #2980b9);
        color: #fff;
        font-size: .9rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: transform .15s, opacity .2s;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status {
        padding: 12px 16px;
        border-radius: 8px;
        font-size: .85rem;
        margin-bottom: 16px;
        display: none;
        line-height: 1.6;
    }
    .status.show { display: block; }
    .status.info { background: #2c3e50; color: #a8d8ff; }
    .status.ok { background: #1e3a29; color: #7be0a0; }
    .status.err { background: #3a1e1e; color: #ff9b9b; }
    .video-box {
        background: #000;
        border-radius: 12px;
        overflow: hidden;
        aspect-ratio: 16/9;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #555;
        font-size: .9rem;
        margin-bottom: 16px;
    }
    .video-box video { width: 100%; height: 100%; display: block; }
    .meta {
        font-size: .8rem;
        color: #888;
        line-height: 1.8;
        padding: 12px 16px;
        background: #12121f;
        border-radius: 8px;
        display: none;
    }
    .meta.show { display: block; }
    .meta b { color: #56ab2f; }
    .tips {
        margin-top: 20px;
        padding: 14px 16px;
        background: #12121f;
        border-left: 3px solid #56ab2f;
        border-radius: 6px;
        font-size: .8rem;
        color: #999;
        line-height: 1.9;
    }
</style>
</head>
<body>
<div class="wrap">
    <h1>🔗 视频链接抓取测试</h1>
    <div class="sub">粘贴视频直链（.mp4 / .webm），测试能否抓取并播放</div>

    <div class="row">
        <input type="text" id="url" placeholder="https://example.com/video.mp4">
        <button id="btn" onclick="fetchVideo()">抓取</button>
    </div>

    <div class="status" id="status"></div>

    <div class="video-box" id="videobox">
        <span>🖼️ 视频将在这里播放</span>
    </div>

    <div class="meta" id="meta"></div>

    <div class="tips">
        <b>测试建议：</b><br>
        • 优先测试自己服务器或图床上的 mp4 直链，成功率最高<br>
        • 如果提示"跨域受限"，说明对方服务器不允许网页直接下载<br>
        • 可试试公开测试视频：<br>
        &nbsp;&nbsp;<code>https://www.w3schools.com/html/mov_bbb.mp4</code>
    </div>
</div>

<script>
const statusEl = document.getElementById('status');
const metaEl = document.getElementById('meta');
const boxEl = document.getElementById('videobox');
const btn = document.getElementById('btn');
const urlInput = document.getElementById('url');

function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'status show ' + (type || 'info');
}

async function fetchVideo() {
    const url = urlInput.value.trim();
    if (!url) { setStatus('请先粘贴视频链接！', 'err'); return; }
    if (!/^https?:\/\//i.test(url)) { setStatus('链接需要以 http:// 或 https:// 开头', 'err'); return; }

    btn.disabled = true;
    btn.textContent = '⏳ 抓取中...';
    setStatus('正在下载视频...', 'info');
    metaEl.classList.remove('show');
    boxEl.innerHTML = '<span>⏳ 下载中...</span>';

    const t0 = performance.now();

    try {
        const resp = await fetch(url, { mode: 'cors', credentials: 'omit' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status} ${resp.statusText}`);

        const blob = await resp.blob();
        if (blob.size === 0) throw new Error('下载到的内容为空');

        const ct = (resp.headers.get('content-type') || '').toLowerCase();
        const looksVideo = ct.startsWith('video/') || ct.includes('octet-stream')
                        || /\.(mp4|webm|mov|mkv|m4v|ogv)(\?|#|$)/i.test(url);
        if (!looksVideo) throw new Error('返回的不是视频文件（Content-Type: ' + ct + '）');

        // 生成文件名
        let filename = 'video.mp4';
        try {
            const u = new URL(url);
            const last = u.pathname.split('/').filter(Boolean).pop();
            if (last) filename = decodeURIComponent(last);
        } catch(e) {}

        // 包装成 File 对象（这一步是关键，后续能直接塞进 rankData）
        const file = new File([blob], filename, { type: blob.type || 'video/mp4' });

        // 播放测试
        const url2 = URL.createObjectURL(blob);
        boxEl.innerHTML = '';
        const video = document.createElement('video');
        video.src = url2;
        video.controls = true;
        video.playsInline = true;
        video.onloadedmetadata = () => {
            const ms = (performance.now() - t0).toFixed(0);
            setStatus('✅ 抓取成功！视频可正常播放。', 'ok');
            metaEl.innerHTML = `
                文件名：<b>${file.name}</b><br>
                大小：<b>${(file.size/1024/1024).toFixed(2)} MB</b><br>
                类型：<b>${file.type}</b><br>
                时长：<b>${video.duration.toFixed(2)} 秒</b><br>
                分辨率：<b>${video.videoWidth} × ${video.videoHeight}</b><br>
                耗时：<b>${ms} ms</b>
            `;
            metaEl.classList.add('show');
        };
        video.onerror = () => setStatus('⚠️ 视频已下载，但浏览器无法解码播放（可能是编码格式不支持）', 'err');
        boxEl.appendChild(video);

        console.log('File 对象已生成，可以直接赋给 rankData[i].videoFile:', file);

    } catch (err) {
        console.error('抓取失败:', err);
        let msg = err.message || String(err);
        if (/failed to fetch|networkerror|cors/i.test(msg)) {
            msg = '跨域受限（CORS），该链接不允许网页直接下载。\n请手动下载视频后用本地文件上传。';
        }
        setStatus('❌ 抓取失败：' + msg, 'err');
        boxEl.innerHTML = '<span>🖼️ 视频将在这里播放</span>';
    } finally {
        btn.disabled = false;
        btn.textContent = '抓取';
    }
}

// 回车快捷触发
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') fetchVideo(); });
</script>
</body>
</html>
