<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BliBli_week副站排名</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .video-container {
            position: relative;
            width: 80%;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* --- 新增的底部致谢样式 --- */
        .footer-credits {
            margin-top: 40px;
            text-align: center;
            font-size: 0.9rem;
            color: #888; /* 灰色字体，不抢眼 */
            line-height: 1.6;
        }
        .footer-credits a {
            color: #00aeec; /* B站蓝链接色 */
            text-decoration: none;
            transition: color 0.3s;
        }
        .footer-credits a:hover {
            color: #fff;
            text-decoration: underline;
        }
        /* ------------------------- */

        /* 移动端适配 */
        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .video-container { width: 100%; }
        }
    </style>
</head>
<body>

    <h1>BliBli_week副站排名</h1>

    <!-- 视频播放区域 -->
    <div class="video-container">
        <!-- 这里默认放了你之前的保底视频，如果需要改，去后台操作即可 -->
        <iframe 
            src="//player.bilibili.com/player.html?bvid=BV1Z4b96sEWy&page=1&high_quality=1&danmaku=0" 
            allowfullscreen="allowfullscreen" 
            width="100%" 
            height="100%">
        </iframe>
    </div>

    <!-- 底部致谢区域 -->
    <div class="footer-credits">
        <p>视频数据来源：<a href="https://vocabili.top/" target="_blank">https://vocabili.top/</a></p>
        <p>感谢 biliboard 工作室所有人员对此网站的支持</p>
    </div>

</body>
</html>
