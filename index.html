<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BliBli_week副站排名</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: radial-gradient(ellipse 60% 40% at 50% -10%, rgba(251, 114, 153, 0.14), transparent 60%), radial-gradient(ellipse 50% 40% at 90% 110%, rgba(0, 174, 236, 0.10), transparent 60%), #121212; color: #fff; font-family: 'Microsoft YaHei', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; }
        .title-badge { display: inline-block; margin-bottom: 14px; padding: 5px 16px; font-size: 0.8rem; letter-spacing: 2px; color: #fb7299; border: 1px solid rgba(251, 114, 153, 0.45); border-radius: 999px; background: rgba(251, 114, 153, 0.08); }
        h1 { font-size: 2.5rem; margin-bottom: 32px; text-align: center; background: linear-gradient(90deg, #fb7299, #ffffff 55%, #00aeec); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 24px rgba(251, 114, 153, 0.25); }
        .video-container { position: relative; width: 100%; max-width: 900px; aspect-ratio: 16 / 9; background: #000; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 24px rgba(0, 0, 0, 0.55), 0 0 60px rgba(251, 114, 153, 0.08); animation: fadeUp 0.6s ease both; }
        .video-container iframe { width: 100%; height: 100%; border: none; }
        .admin-link { margin-top: 24px; padding: 8px 22px; color: #9aa0a6; text-decoration: none; font-size: 0.9rem; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 999px; transition: color 0.3s, border-color 0.3s, background 0.3s; }
        .admin-link:hover { color: #fff; border-color: #fb7299; background: rgba(251, 114, 153, 0.12); }
        .footer-credits { margin-top: 44px; text-align: center; font-size: 0.9rem; color: #888; line-height: 1.8; }
        .footer-credits a { color: #00aeec; text-decoration: none; transition: color 0.3s; }
        .footer-credits a:hover { color: #fff; text-decoration: underline; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { body { padding: 24px 16px; } h1 { font-size: 1.8rem; margin-bottom: 24px; } .footer-credits { margin-top: 32px; font-size: 0.8rem; } }
    </style>
</head>
<body>
    <span class="title-badge">WEEKLY RANKING · 周榜</span>
    <h1>BliBli_week副站排名</h1>
    <div class="video-container">
        <iframe src="//player.bilibili.com/player.html?bvid=BV1Arbe6LEzS&page=1&high_quality=1&danmaku=0" allowfullscreen="allowfullscreen"></iframe>
    </div>
    <a href="admin.html" class="admin-link">管理员界面</a>
    <div class="footer-credits">
        <p>视频数据来源：<a href="https://vocabili.top/" target="_blank">https://vocabili.top/</a></p>
        <p>感谢 biliboard 工作室所有人员对此网站的支持</p>
    </div>
</body>
</html>
