<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BliBli_week副站排名</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 960px; /* 限制最大宽度，保持美观 */
            aspect-ratio: 16 / 9; /* 保持16:9比例 */
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid #333;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .admin-link {
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .admin-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <h1>BliBli_week副站排名</h1>

    <!-- 视频播放区域 -->
    <div class="video-container">
        <!-- 默认播放视频：BV1Z4b96sEWy -->
        <!-- 以后更新时，只需修改 src 中的 BV号 即可 -->
        <iframe 
            id="bili-player"
            src="//player.bilibili.com/player.html?isOutside=true&aid=&bvid=BV1Z4b96sEWy&cid=&p=1&high_quality=1&danmaku=0" 
            allowfullscreen="allowfullscreen" 
            width="100%" 
            height="100%" 
            scrolling="no" 
            frameborder="0" 
            sandbox="allow-top-navigation allow-same-origin allow-forms allow-scripts">
        </iframe>
    </div>

    <!-- 管理员入口 -->
    <a href="admin.html" class="admin-link">管理员界面</a>

    <script>
        // 页面加载时，检查本地存储是否有新的 BV 号
        // 这样你在 admin.html 修改后，这里会自动读取并播放新的
        window.onload = function() {
            const savedBV = localStorage.getItem('current_bvid');
            if (savedBV) {
                updatePlayer(savedBV);
            }
        };

        // 更新播放器的函数
        function updatePlayer(bvid) {
            const player = document.getElementById('bili-player');
            // 拼接 B站的高清播放器链接
            // high_quality=1 开启高清
            // danmaku=0 默认关闭弹幕（可选）
            const newSrc = `//player.bilibili.com/player.html?isOutside=true&bvid=${bvid}&p=1&high_quality=1&danmaku=0`;
            player.src = newSrc;
            console.log(`✅ 已加载视频: ${bvid}`);
        }
    </script>

</body>
</html>
