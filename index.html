<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>花生语翻译器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff5e6, #ffe4c4);
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            padding: 40px 20px;
        }
        h1 { font-size: 36px; color: #d2691e; margin-bottom: 40px; }
        .container { display: flex; gap: 20px; width: 100%; max-width: 1000px; align-items: center; }
        .box { flex: 1; position: relative; }
        .box-label { position: absolute; top: 10px; left: 14px; font-size: 14px; font-weight: bold; color: #8b4513; z-index: 1; }
        textarea {
            width: 100%; height: 300px; border: 3px solid #d2a679; border-radius: 14px;
            padding: 40px 16px 16px; font-size: 18px; resize: none; outline: none;
            background: rgba(255,255,255,0.85);
        }
        textarea:focus { border-color: #ff8c00; }
        .arrow { font-size: 40px; color: #d2691e; }
        .btn {
            display: block; margin: 24px auto 0; padding: 12px 48px; font-size: 20px;
            font-weight: bold; color: #fff; background: linear-gradient(135deg, #ff8c00, #d2691e);
            border: none; border-radius: 30px; cursor: pointer;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <h1>🥜 花生语翻译器</h1>
    <div class="container">
        <div class="box">
            <span class="box-label">原文</span>
            <textarea id="input" placeholder="输入中文..."></textarea>
        </div>
        <div class="arrow">➡️</div>
        <div class="box">
            <span class="box-label">花生语</span>
            <textarea id="output" readonly placeholder="翻译结果..."></textarea>
        </div>
    </div>
    <button class="btn" id="btn">翻 译</button>

        document.getElementById('btn').addEventListener('click', function() {
            var input = document.getElementById('input').value.trim();
            var output = document.getElementById('output');

            if (!input) { output.value = ''; return; }

            var result = '';
            for (var i = 0; i < input.length; i++) {
                var ch = input[i];
                if (dict[ch]) {
                    result += dict[ch];
                } else {
                    result += ch;
                }
            }

            // 花生语表情包加持
            result = result.replace(/([,，、])/g, '、💪💖❗️❗️❗️');
            result = result.replace(/。/g, '。💪💪💖💖');
            result += '\n😭💖😭💖😭💖';
